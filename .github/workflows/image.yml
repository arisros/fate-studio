name: Image

on:
  workflow_call:
    inputs:
      tag:
        description: release tag to build, such as v0.5.0
        required: true
        type: string
  # Backfills an image for a tag released before this workflow existed.
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to build, such as v0.5.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    name: publish the container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: build
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${TAG#v}" \
            -t "${IMAGE}:${TAG#v}" .

      - name: push
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGE}:${TAG#v}"
          echo "published \`${IMAGE}:${TAG#v}\`" >> "$GITHUB_STEP_SUMMARY"
